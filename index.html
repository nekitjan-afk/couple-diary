<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Couple Dairy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#09090b;--card:#18181b;--card2:#27272a;--accent:#8b5cf6;--accent2:#c4b5fd;--text:#fafafa;--muted:#a1a1aa;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
.header{display:flex;align-items:center;padding:14px 18px;position:sticky;top:0;background:rgba(9,9,11,.8);backdrop-filter:blur(24px);z-index:100}
.burger{width:44px;height:44px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid rgba(255,255,255,.06)}
.header-title{flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.4px}
.sidebar{position:fixed;top:0;left:-300px;width:280px;height:100%;background:linear-gradient(180deg,#18181b 0%,#09090b 100%);z-index:1000;transition:.35s cubic-bezier(.4,0,.2,1);padding:28px 18px;border-right:1px solid rgba(255,255,255,.05)}
.sidebar.open{left:0}
.sidebar-header{font-size:24px;font-weight:700;margin-bottom:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none;backdrop-filter:blur(6px)}
.overlay.show{display:block}
.menu-item{padding:15px 18px;border-radius:16px;margin-bottom:6px;cursor:pointer;font-weight:500;font-size:16px;transition:.15s}
.menu-item:active{background:var(--card2);transform:scale(.98)}
.sidebar-footer{margin-top:auto;padding:16px 0;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.content{padding:6px 16px 24px}
.section{display:none}
.section.active{display:block}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:14px;border:1px solid rgba(255,255,255,.04);transition:.2s}
.card:active{transform:scale(.985)}
button{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;transition:.15s;box-shadow:0 4px 20px rgba(139,92,246,.3)}
button:active{transform:scale(.97)}
input,textarea,select{width:100%;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:var(--card2);color:var(--text);font-size:16px;margin-bottom:10px;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.calendar{background:var(--card);border-radius:26px;padding:18px;margin-bottom:16px;border:1px solid rgba(255,255,255,.04)}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-weight:600;font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.weekday{font-size:12px;color:var(--muted);padding:8px 0;font-weight:500}
.cal-day{padding:13px 0;border-radius:14px;cursor:pointer;position:relative;font-weight:500;transition:.15s}
.cal-day:active{background:var(--card2)}
.cal-day.today{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;box-shadow:0 4px 16px rgba(139,92,246,.4)}
.cal-day.has-event::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:var(--accent2);border-radius:50%}
.cal-day .tooltip{display:none;position:absolute;bottom:115%;left:50%;transform:translateX(-50%);background:#3f3f46;padding:7px 12px;border-radius:10px;font-size:12px;white-space:nowrap;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.cal-day:hover .tooltip{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(10px)}
.modal.show{display:flex}
.modal-content{background:var(--card);width:100%;max-width:520px;border-radius:32px 32px 0 0;padding:22px 22px 36px;max-height:88vh;overflow-y:auto;border-top:1px solid rgba(255,255,255,.08)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:19px;font-weight:600}
.close-modal{font-size:30px;cursor:pointer;opacity:.5;line-height:1}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.days-num{font-size:64px;font-weight:800;background:linear-gradient(135deg,#f472b6,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-3px}
h2{font-size:24px;font-weight:700;margin-bottom:18px;letter-spacing:-.6px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.cat{padding:10px 18px;border-radius:22px;background:var(--card2);font-size:14px;cursor:pointer;font-weight:500;transition:.15s}
.cat.active{background:var(--accent);color:#fff}
.date-card{background:var(--card);padding:24px;border-radius:20px;margin:16px 0;text-align:center;border:1px solid rgba(255,255,255,.04)}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">Couple Dairy</div>
  <div class="menu-item" onclick="show('home')">🏠 Главная</div>
  <div class="menu-item" onclick="show('calendar')">📅 Календарь</div>
  <div class="menu-item" onclick="show('dates')">💑 Свидания</div>
  <div class="menu-item" onclick="show('link')">🔗 Привязать партнёра</div>
  <div class="sidebar-footer" id="footer">Загрузка...</div>
</div>
<div class="header">
  <div class="burger" onclick="openMenu()">☰</div>
  <div class="header-title" id="title">Главная</div>
</div>
<div class="content">
  <div id="home" class="section active">
    <div id="homeWidgets"></div>
  </div>
  <div id="calendar" class="section">
    <div class="calendar">
      <div class="cal-header">
        <span onclick="changeMonth(-1)" style="cursor:pointer;padding:8px">‹</span>
        <span id="calTitle"></span>
        <span onclick="changeMonth(1)" style="cursor:pointer;padding:8px">›</span>
      </div>
      <div class="cal-grid" id="calWeekdays"></div>
      <div class="cal-grid" id="calDays"></div>
    </div>
    <button onclick="openEventsList()" style="background:#2a2a2e;">Список событий</button>
  </div>
  <div id="dates" class="section">
    <h2>Генератор свиданий</h2>
    <button onclick="openFilters()" style="background:#2a2a2e;">Фильтры</button>
    <button onclick="randomDate()">🎲 Случайное свидание</button>
    <div id="dateResult"></div>
  </div>
  <div id="link" class="section">
    <h2>Привязать партнёра</h2>
    <div style="background:#1c1c1e;padding:20px;border-radius:14px;text-align:center;margin:16px 0">
      <div>Твой код:</div>
      <div style="font-size:28px;font-weight:700;letter-spacing:4px;margin:8px 0" id="myCode">------</div>
    </div>
    <input id="pCode" placeholder="Код партнёра">
    <button id="linkBtn" onclick="doLink()">Привязать</button>
    <div id="linkMsg" style="text-align:center;margin:16px 0;"></div>
    <button id="unlinkBtn" onclick="doUnlink()" style="background:#ff4444;display:none;">Отвязать партнёра</button>
  </div>
</div>

<div class="modal" id="filtersModal" onclick="closeFilters(event)"><div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title">Фильтры</div><div class="close-modal" onclick="closeFilters()">×</div></div><div class="cats" id="cats"></div><button onclick="closeFilters()">Готово</button></div></div>
<div class="modal" id="eventsModal" onclick="closeEvents(event)"><div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title" id="eventsModalTitle">События</div><div class="close-modal" onclick="closeEvents()">×</div></div><div id="eventsList"></div></div></div>
<div class="modal" id="eventDetailModal" onclick="closeEventDetail(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header" style="justify-content:space-between;margin-bottom:8px">
      <div onclick="backToDayList()" style="font-size:24px;cursor:pointer;padding:4px 12px 4px 0">←</div>
      <div class="close-modal" onclick="closeEventDetail()">×</div>
    </div>
    <div class="modal-title" id="detailTitle" style="font-size:20px;margin-bottom:6px"></div>
    <div id="detailDate" style="opacity:0.6;margin-bottom:16px;font-size:15px"></div>
    <div id="detailDesc" style="line-height:1.5;font-size:16px;margin-bottom:16px"></div>
    <button onclick="openRemind()" style="background:#2a2a2e;">Напомнить</button>
  </div>
</div>

<div class="modal" id="remindModal" onclick="closeRemind(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">Напоминание</div>
      <div class="close-modal" onclick="closeRemind()">×</div>
    </div>
    <div style="margin-bottom:6px;opacity:0.8">Когда напомнить:</div>
    <input type="datetime-local" id="remindAt">
    <div style="margin:14px 0 6px;opacity:0.8">Кому отправить:</div>
    <select id="remindTarget" style="width:100%;padding:14px;border-radius:12px;background:#2a2a2e;color:#fff;border:none;font-size:16px">
      <option value="me">Только мне</option>
      <option value="partner">Только партнёру</option>
      <option value="both">Нам обоим</option>
    </select>
    <div style="margin:14px 0 6px;opacity:0.8">Текст сообщения:</div>
    <textarea id="remindText" rows="3" placeholder="Не забудьте о вашем событии">Не забудьте о вашем событии</textarea>
    <button onclick="saveReminder()" style="margin-top:8px">Установить напоминание</button>
  </div>
</div>

<div class="modal" id="planModal" onclick="closePlan(event)">
  <div class="modal-content" onclick="event.stopPropagation()" style="z-index:3000">
    <div class="modal-header">
      <div class="modal-title" id="planTitle">Запланировать</div>
      <div class="close-modal" onclick="closePlan()">×</div>
    </div>
    <input id="planEvTitle" placeholder="Название" style="pointer-events:auto">
    <textarea id="planEvDesc" placeholder="Описание" rows="2" style="pointer-events:auto"></textarea>
    <button onclick="addEventFromPlan()">Запланировать событие</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const user = tg.initDataUnsafe?.user || {};
const userId = user.id || 0;
let partner = null;
let currentCat = 'all';
let currentDate = new Date();
let allEvents = [];

const DATE_IDEAS = [
  {cat:'романтика', title:'Ужин при свечах', desc:'Приготовить что-то простое вместе и поужинать при свечах дома'},
  {cat:'романтика', title:'Пикник на закате', desc:'Взять плед, фрукты и напитки, найти красивое место на закате'},
  {cat:'романтика', title:'Прогулка под звёздами', desc:'Выйти вечером в парк или на набережную'},
  {cat:'кино', title:'Кино дома', desc:'Выбрать фильм и сделать попкорн'},
  {cat:'кино', title:'Сходить в кино', desc:'Выбрать премьеру и сходить в кинотеатр'},
  {cat:'актив', title:'Прогулка на велосипедах', desc:'Покататься по городу или парку'},
  {cat:'актив', title:'Боулинг', desc:'Сходить поиграть в боулинг'},
  {cat:'дом', title:'Готовим вместе', desc:'Выбрать рецепт и приготовить ужин'},
  {cat:'дом', title:'Настольные игры', desc:'Вечер настолок'},
  {cat:'бюджет', title:'Кофе и прогулка', desc:'Кофе навынос и прогулка по городу'},
  {cat:'город', title:'Новый район', desc:'Погулять в районе, где ещё не были'},
  {cat:'еда', title:'Завтрак вне дома', desc:'Сходить на завтрак или бранч'}
];

const CATEGORIES = [
  {id:'all', name:'Все'},
  {id:'романтика', name:'Романтика'},
  {id:'дом', name:'Дома'},
  {id:'кино', name:'Кино'},
  {id:'еда', name:'Еда'},
  {id:'актив', name:'Активный отдых'},
  {id:'город', name:'По городу'},
  {id:'бюджет', name:'Бюджетные'}
];

function openMenu(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function show(id){
  closeMenu();
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('title').textContent = {home:'Главная',calendar:'Календарь',dates:'Свидания',link:'Привязка'}[id]||id;
  if(id==='calendar') loadEvents();
  if(id==='home') updateHome();
}

function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('calTitle').textContent = monthNames[month] + ' ' + year;
  const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  document.getElementById('calWeekdays').innerHTML = weekdays.map(d => `<div class="weekday">${d}</div>`).join('');
  const firstDay = new Date(year, month, 1);
  let start = (firstDay.getDay() || 7) - 1;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let html = '';
  for (let i = 0; i < start; i++) html += `<div class="cal-day other"></div>`;
  const today = new Date();
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getDate()===d && today.getMonth()===month && today.getFullYear()===year;
    const eventsOnDay = allEvents.filter(e => e.date === dateStr);
    const tip = eventsOnDay.length ? (eventsOnDay.length > 1 ? `${eventsOnDay.length} события` : eventsOnDay[0].title) : 'Событий не запланировано';
    html += `<div class="cal-day ${isToday?'today':''} ${eventsOnDay.length?'has-event':''}" onclick="onDateClick('${dateStr}')">${d}<div class="tooltip">${tip}</div></div>`;
  }
  document.getElementById('calDays').innerHTML = html;
}
function changeMonth(dir) { currentDate.setMonth(currentDate.getMonth() + dir); renderCalendar(); }
function onDateClick(date) {
  const events = allEvents.filter(e => e.date === date);
  document.getElementById('eventsModalTitle').textContent = 'События на ' + date;
  const list = document.getElementById('eventsList');
  let html = '';
  if (events.length) {
    html = events.map((e, i) => {
      const safe = (e.title||'').replace(/'/g,"\\'");
      return `<div style="background:#2a2a2e;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div onclick="showEventDetailByDate('${date}',${i})" style="flex:1;font-weight:600">${e.title}</div>
        <div onclick="doDelete('${date}','${safe}')" style="color:#ff3b30;font-size:22px;padding:6px 10px">🗑</div>
      </div>`;
    }).join('');
  } else {
    html = '<div class="card">Событий нет</div>';
  }
  const today = new Date(); today.setHours(0,0,0,0);
  if (new Date(date) >= today) {
    html += `<button onclick="event.stopPropagation(); openPlanForDate('${date}')" style="margin-top:12px;background:#2a2a2e;">Добавить событие</button>`;
  }
  list.innerHTML = html;
  document.getElementById('eventsModal').classList.add('show');
}
function openPlanForDate(date) {
  window.selectedDate = date;
  document.getElementById('planTitle').textContent = 'Запланировать на ' + date;
  document.getElementById('eventsModal').classList.remove('show');
  setTimeout(() => {
    document.getElementById('planModal').classList.add('show');
  }, 50);
}
function showEventDetailByDate(date, index) {
  const events = allEvents.filter(e => e.date === date);
  const e = events[index];
  if (!e) return;
  window.currentDayDate = date;
  document.getElementById('detailTitle').textContent = e.title;
  document.getElementById('detailDate').textContent = e.date;
  document.getElementById('detailDesc').textContent = e.description || 'Без описания';
  closeEvents();
  document.getElementById('eventDetailModal').classList.add('show');
}
function backToDayList() {
  closeEventDetail();
  if (window.currentDayDate) onDateClick(window.currentDayDate);
}
async function loadEvents() {
  try {
    const r = await fetch('/api/events?user_id=' + userId);
    allEvents = await r.json() || [];
    renderCalendar();
    updateHome();
  } catch(e) { allEvents = []; }
}
function openEventsList() {
  document.getElementById('eventsModalTitle').textContent = 'Все события';
  const list = document.getElementById('eventsList');
  list.innerHTML = allEvents.length ? allEvents.map((e,i) => `<div class="card" onclick="showEventDetail(${i})"><b>${e.title}</b><br><small>${e.date}</small></div>`).join('') : '<div class="card">Пока нет событий</div>';
  document.getElementById('eventsModal').classList.add('show');
}
function closeEvents(e) { if (!e || e.target.id === 'eventsModal') document.getElementById('eventsModal').classList.remove('show'); }
function showEventDetail(i) {
  const e = allEvents[i];
  document.getElementById('detailTitle').textContent = e.title;
  document.getElementById('detailDate').textContent = e.date;
  document.getElementById('detailDesc').textContent = e.description || 'Без описания';
  closeEvents();
  document.getElementById('eventDetailModal').classList.add('show');
}
function closeEventDetail(e) { if (!e || e.target.id === 'eventDetailModal') document.getElementById('eventDetailModal').classList.remove('show'); }
function doDelete(date, title) {
  if (confirm('Удалить событие "' + title + '"?')) {
    deleteEvent(date, title);
  }
}
async function deleteEvent(date, title) {
  try {
    const r = await fetch('/api/event/delete', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({user_id: userId, title: title, date: date})
    });
    await loadEvents();
    onDateClick(date);
    tg.HapticFeedback.notificationOccurred('success');
  } catch(e) {
    tg.showAlert('Ошибка удаления');
  }
}
function deleteCurrentEvent() {
  const title = window.currentEventTitle || document.getElementById('detailTitle').textContent;
  const date = document.getElementById('detailDate').textContent;
  if (confirm('Удалить событие "' + title + '"?')) {
    deleteEvent(date, title);
    closeEventDetail();
  }
}
function openRemind() {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset() + 2);
  document.getElementById('remindAt').value = now.toISOString().slice(0,16);
  
  const sel = document.getElementById('remindTarget');
  if (!partner) {
    sel.innerHTML = '<option value="me">Только мне</option>';
    sel.value = 'me';
  } else {
    sel.innerHTML = `
      <option value="me">Только мне</option>
      <option value="partner">Только партнёру</option>
      <option value="both">Нам обоим</option>
    `;
  }
  document.getElementById('remindModal').classList.add('show');
}
function closeRemind(e) {
  if (!e || e.target.id === 'remindModal') document.getElementById('remindModal').classList.remove('show');
}
async function saveReminder() {
  const remindAt = document.getElementById('remindAt').value;
  if (!remindAt) return tg.showAlert('Выбери дату и время');
  const iso = remindAt.length === 16 ? remindAt : remindAt.slice(0,16);
  const target = document.getElementById('remindTarget').value;
  const customText = document.getElementById('remindText').value.trim() || 'Не забудьте о вашем событии';
  const title = document.getElementById('detailTitle').textContent;
  const eventDate = document.getElementById('detailDate').textContent;
  const partnerId = partner ? partner.id : null;
  await fetch('/api/reminder', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      title, event_date: eventDate, remind_at: iso,
      user_id: userId, partner_id: partnerId, target, text: customText
    })
  });
  closeRemind();
  tg.showAlert('Напоминание установлено');
  tg.HapticFeedback.notificationOccurred('success');
}
function closePlan(e) { if (!e || e.target.id === 'planModal') document.getElementById('planModal').classList.remove('show'); }
async function addEventFromPlan() {
  const title = document.getElementById('planEvTitle').value.trim();
  const date = window.selectedDate;
  const description = document.getElementById('planEvDesc').value.trim();
  if (!title || !date) return tg.showAlert('Введи название');

  const exists = allEvents.some(e => e.date === date && e.title.toLowerCase() === title.toLowerCase());
  if (exists) return tg.showAlert('Событие с таким названием уже есть на эту дату');

  try {
    const r = await fetch('/api/event', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id:userId, title, date, description})
    });
    if (!r.ok) {
      const txt = await r.text();
      return tg.showAlert('Ошибка сервера: ' + r.status + ' ' + txt.slice(0,100));
    }
    const d = await r.json();
    if (d && d.ok === false) return tg.showAlert(d.error || 'Ошибка');
  } catch(e) {
    return tg.showAlert('Ошибка: ' + e.message);
  }

  document.getElementById('planEvTitle').value = '';
  document.getElementById('planEvDesc').value = '';
  closePlan();
  await loadEvents();
  onDateClick(date);
  tg.HapticFeedback.notificationOccurred('success');
}
function renderFooter() {
  const f = document.getElementById('footer');
  const ava = user.photo_url ? `<img src="${user.photo_url}">` : (user.first_name?.[0] || '?');
  f.innerHTML = partner 
    ? `<div class="avatar">${ava}</div><div class="avatar" style="margin-left:-12px;border:2px solid #1c1c1e">${partner.photo?`<img src="${partner.photo}">`:(partner.name?.[0]||'?')}</div>`
    : `<div class="avatar">${ava}</div><div><b>${user.first_name || 'Пользователь'}</b><br><small style="opacity:.6">${user.username ? '@'+user.username : ''}</small></div>`;
}
function updateHome() {
  const box = document.getElementById('homeWidgets');
  let html = '';
  
  if (partner) {
    const s = localStorage.getItem('relStart');
    if (s) {
      const days = Math.floor((Date.now() - new Date(s)) / 86400000);
      const [y,m,d] = s.split('-');
      html += `<div class="card" onclick="openRelDate()" style="text-align:center;padding:24px">
        <div style="font-size:48px;font-weight:700">${days}</div>
        <div style="opacity:0.6;margin-top:4px">в отношениях с ${d}.${m}.${y}</div>
      </div>`;
    } else {
      html += `<div class="card" onclick="openRelDate()" style="text-align:center;padding:24px">
        <div style="font-size:18px">Указать дату начала отношений</div>
      </div>`;
    }
    
    html += `<div class="card" id="moodWidget" style="margin-top:12px;text-align:center;padding:20px">
      <div style="font-size:15px;margin-bottom:8px">Настроение партнёра</div>
      <div id="partnerMood" style="font-size:22px;font-weight:600;margin-bottom:12px">...</div>
      <div id="myMoodBtns" style="display:none">
        <div style="font-size:14px;opacity:0.7;margin-bottom:8px">Как вы себя чувствуете?</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button onclick="setMyMood('плохо')" style="background:#ff4444;padding:10px 14px;font-size:14px">Плохо</button>
          <button onclick="setMyMood('нормально')" style="background:#ffaa00;padding:10px 14px;font-size:14px">Нормально</button>
          <button onclick="setMyMood('хорошо')" style="background:#44cc44;padding:10px 14px;font-size:14px">Хорошо</button>
        </div>
      </div>
    </div>`;
  }
  
  const upcoming = allEvents.filter(e => e.date >= new Date().toISOString().slice(0,10)).sort((a,b) => a.date.localeCompare(b.date));
  if (upcoming.length) {
    const ev = upcoming[0];
    html += `<div class="card" onclick="openNearestEvent()" style="margin-top:12px">
      <div style="font-size:13px;opacity:0.6">Ближайшее событие</div>
      <div style="font-size:18px;font-weight:600;margin-top:4px">${ev.title}</div>
      <div style="opacity:0.7;margin-top:2px">${ev.date}</div>
    </div>`;
  }
  
  box.innerHTML = html;
  if (partner) {
    loadPartnerMood();
    checkMoodTime();
  }
}

function checkMoodTime() {
  const now = new Date();
  const h = now.getHours();
  const slots = [10, 14, 18, 22];
  const key = 'moodSlot_' + now.toISOString().slice(0,10) + '_' + h;
  const already = localStorage.getItem(key);
  if (slots.includes(h) && !already) {
    const btns = document.getElementById('myMoodBtns');
    if (btns) btns.style.display = 'block';
  }
}

function openRelDate() {
  const cur = localStorage.getItem('relStart');
  let def = '01.01.2024';
  if (cur) { const p = cur.split('-'); if (p.length===3) def = p[2]+'.'+p[1]+'.'+p[0]; }
  const inp = prompt('Дата начала (ДД.ММ.ГГГГ):', def);
  if (!inp) return;
  const m = inp.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) return tg.showAlert('Формат: ДД.ММ.ГГГГ');
  const iso = m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
  localStorage.setItem('relStart', iso);
  updateHome();
}

async function setMyMood(mood) {
  await fetch('/api/mood', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({user_id: userId, mood})
  });
  const now = new Date();
  const key = 'moodSlot_' + now.toISOString().slice(0,10) + '_' + now.getHours();
  localStorage.setItem(key, '1');
  document.getElementById('myMoodBtns').style.display = 'none';
  tg.HapticFeedback.notificationOccurred('success');
  loadPartnerMood();
}

async function loadPartnerMood() {
  if (!partner) return;
  try {
    const r = await fetch('/api/mood?user_id=' + userId);
    const d = await r.json();
    const el = document.getElementById('partnerMood');
    if (el) el.textContent = d.mood ? d.mood.charAt(0).toUpperCase() + d.mood.slice(1) : 'Не указано';
  } catch(e) {}
}

function openNearestEvent() {
  const upcoming = allEvents.filter(e => e.date >= new Date().toISOString().slice(0,10)).sort((a,b) => a.date.localeCompare(b.date));
  if (!upcoming.length) return;
  const ev = upcoming[0];
  show('calendar');
  setTimeout(() => {
    onDateClick(ev.date);
    setTimeout(() => {
      const events = allEvents.filter(e => e.date === ev.date);
      const idx = events.findIndex(e => e.title === ev.title);
      if (idx >= 0) showEventDetailByDate(ev.date, idx);
    }, 100);
  }, 100);
}
async function init() {
  ['planModal','remindModal','eventsModal','eventDetailModal','filtersModal'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('show');
  });
  document.getElementById('myCode').textContent = userId ? String(userId).slice(-6).padStart(6,'0') : 'НЕТ ID';
  renderFooter();
  updateHome();
  renderCats();
  renderCalendar();
  if (!userId) return;
  try {
    const r = await fetch(`/api/me?user_id=${userId}&name=${encodeURIComponent(user.first_name||'')}&username=${user.username||''}&photo=${encodeURIComponent(user.photo_url||'')}`);
    const d = await r.json();
    if (d && d.partner) {
      partner = d.partner;
      renderFooter();
      updateHome();
      document.getElementById('linkMsg').textContent = 'Партнёр привязан';
      document.getElementById('pCode').style.display = 'none';
      document.getElementById('linkBtn').style.display = 'none';
      document.getElementById('unlinkBtn').style.display = 'block';
    }
  } catch(e) {}
  loadEvents();
}
async function doLink() {
  const code = document.getElementById('pCode').value.trim();
  if (!code) return tg.showAlert('Введи код');
  try {
    const r = await fetch('/api/link', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({user_id:userId, code})});
    const d = await r.json();
    if (!d.ok) return tg.showAlert(d.error || 'Ошибка');
    partner = d.partner;
    renderFooter(); updateHome();
    document.getElementById('linkMsg').textContent = 'Успешно привязан!';
    document.getElementById('unlinkBtn').style.display = 'block';
    document.getElementById('pCode').style.display = 'none';
    document.getElementById('linkBtn').style.display = 'none';
  } catch(e) { tg.showAlert('Ошибка: ' + e.message); }
}
async function doUnlink() {
  if (!confirm('Точно отвязать партнёра?')) return;
  const r = await fetch('/api/unlink', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({user_id:userId})});
  const d = await r.json();
  if (d.ok) {
    partner = null; renderFooter(); updateHome();
    document.getElementById('linkMsg').textContent = 'Партнёр отвязан';
    document.getElementById('unlinkBtn').style.display = 'none';
    document.getElementById('pCode').style.display = 'block';
    document.getElementById('linkBtn').style.display = 'block';
  }
}
async function addEvent() {
  const title = document.getElementById('evTitle').value.trim();
  const date = document.getElementById('evDate').value;
  const description = document.getElementById('evDesc').value.trim();
  if (!title || !date) return tg.showAlert('Заполни название и дату');
  const today = new Date(); today.setHours(0,0,0,0);
  if (new Date(date) < today) return tg.showAlert('Нельзя добавлять события задним числом');
  await fetch('/api/event', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({user_id:userId, title, date, description})});
  document.getElementById('evTitle').value = '';
  document.getElementById('evDate').value = '';
  document.getElementById('evDesc').value = '';
  loadEvents();
}
function renderCats() {
  document.getElementById('cats').innerHTML = CATEGORIES.map(c => `<div class="cat ${c.id===currentCat?'active':''}" onclick="setCat('${c.id}')">${c.name}</div>`).join('');
}
function setCat(cat) { currentCat = cat; renderCats(); document.getElementById('dateResult').innerHTML = ''; closeFilters(); }
function openFilters() { document.getElementById('filtersModal').classList.add('show'); }
function closeFilters(e) { if (!e || e.target.id === 'filtersModal') document.getElementById('filtersModal').classList.remove('show'); }
function randomDate() {
  let list = currentCat === 'all' ? DATE_IDEAS : DATE_IDEAS.filter(d => d.cat === currentCat);
  if (!list.length) return;
  const idea = list[Math.floor(Math.random() * list.length)];
  document.getElementById('dateResult').innerHTML = `<div class="date-card"><div style="font-size:20px;font-weight:700;margin-bottom:8px">${idea.title}</div><div style="opacity:0.8">${idea.desc}</div></div>`;
}
init();
</script>
</body>
