<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Couple Dairy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
        .header { display: flex; align-items: center; padding: 16px 20px; }
        .burger { font-size: 28px; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1c1c1e; }
        .header-title { flex: 1; text-align: center; font-weight: 600; font-size: 18px; margin-right: 40px; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #1c1c1e; z-index: 1000; transition: left 0.3s; display: flex; flex-direction: column; }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 24px; font-size: 22px; font-weight: 700; }
        .menu-item { padding: 16px 24px; font-size: 17px; cursor: pointer; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #333; margin-top: auto; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
        .overlay.show { display: block; }
        .content { padding: 20px; }
        .section { display: none; }
        .section.active { display: block; }
        .code-box { background: #1c1c1e; padding: 20px; border-radius: 14px; text-align: center; margin: 20px 0; }
        .code { font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 10px 0; color: #ff6b6b; }
        input, button { width: 100%; padding: 16px; margin: 8px 0; border-radius: 12px; border: none; font-size: 16px; }
        button { background: #2481cc; color: white; font-weight: 600; }
        .debug { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #222; padding: 8px; font-size: 12px; border-radius: 8px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Couple Dairy</div>
        <div class="menu-item" onclick="openSection('home')">🏠 Главная</div>
        <div class="menu-item" onclick="openSection('calendar')">📅 Календарь</div>
        <div class="menu-item" onclick="openSection('link')">🔗 Привязать партнёра</div>
        <div class="sidebar-footer" id="footer">Загрузка...</div>
    </div>

    <div class="header">
        <div class="burger" onclick="openMenu()">☰</div>
        <div class="header-title">Привязка</div>
    </div>

    <div class="content">
        <div id="link" class="section active">
            <h2>Привязать партнёра</h2>
            <div class="code-box">
                <div>Твой код:</div>
                <div class="code" id="myCode">ЗАГРУЗКА</div>
            </div>
            <input type="text" id="partnerCode" placeholder="Код партнёра">
            <button onclick="alert('Пока тест')">Привязать</button>
        </div>
    </div>

    <div class="debug" id="debug">debug: старт</div>

    <script>
        const debug = document.getElementById('debug');
        function log(msg) { debug.textContent = msg; console.log(msg); }

        try {
            const tg = window.Telegram?.WebApp;
            log('TG: ' + (tg ? 'есть' : 'нет'));
            
            if (tg) {
                tg.ready();
                tg.expand();
            }

            const user = tg?.initDataUnsafe?.user;
            log('User: ' + (user ? user.id : 'нет данных'));

            const userId = user?.id || Math.floor(Math.random() * 900000 + 100000);
            const code = String(userId).slice(-6).padStart(6, '0');
            
            document.getElementById('myCode').textContent = code;
            document.getElementById('footer').innerHTML = user 
                ? `${user.first_name || 'Юзер'} ${user.username ? '@'+user.username : ''}`
                : 'Нет данных Telegram';

            log('Код установлен: ' + code);
        } catch (e) {
            log('Ошибка: ' + e.message);
            document.getElementById('myCode').textContent = 'ОШИБКА';
        }

        function openMenu() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeMenu() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        function openSection(name) { closeMenu(); }
    </script>
</body>
</html>
