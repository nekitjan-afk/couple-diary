<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Couple Dairy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #0f0f0f);
            color: var(--tg-theme-text-color, #ffffff);
            min-height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
        }
        .burger {
            font-size: 28px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
        }
        .header-title {
            flex: 1;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            margin-right: 40px;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: #1c1c1e;
            z-index: 1000;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.4);
        }
        .sidebar.open { left: 0; }
        .sidebar-header {
            padding: 24px 24px 16px;
            font-size: 22px;
            font-weight: 700;
        }
        .menu-items { flex: 1; }
        .menu-item {
            padding: 16px 24px;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-item:hover { background: rgba(255,255,255,0.08); }
        .sidebar-footer {
            padding: 16px 20px 24px;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .user-info { font-size: 14px; }
        .user-name { font-weight: 600; }
        .user-username { opacity: 0.6; font-size: 13px; }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.show { display: block; }
        .content { padding: 10px 20px 40px; }
        .section { display: none; }
        .section.active { display: block; }
        .days-counter { text-align: center; padding: 60px 20px 40px; }
        .days-number {
            font-size: 92px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .days-label { font-size: 20px; opacity: 0.8; margin-top: 8px; }
        .together-since { margin-top: 16px; font-size: 15px; opacity: 0.6; }
        h2 { margin: 10px 0 20px; font-size: 24px; }
        input, textarea, button {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #fff);
        }
        button {
            background: var(--tg-theme-button-color, #ff6b6b);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
            padding: 18px;
            border-radius: 16px;
            margin: 12px 0;
        }
        .empty { text-align: center; opacity: 0.5; padding: 60px 0; }
        .link-box {
            background: #1c1c1e;
            padding: 16px;
            border-radius: 14px;
            margin: 16px 0;
            text-align: center;
        }
        .code {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Couple Dairy</div>
        <div class="menu-items">
            <div class="menu-item" onclick="openSection('home')">🏠 Главная</div>
            <div class="menu-item" onclick="openSection('calendar')">📅 Календарь</div>
            <div class="menu-item" onclick="openSection('memories')">💌 Воспоминания</div>
            <div class="menu-item" onclick="openSection('link')">🔗 Привязать партнёра</div>
        </div>
        <div class="sidebar-footer">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-info">
                <div class="user-name" id="userName">Загрузка...</div>
                <div class="user-username" id="userUsername"></div>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="burger" onclick="openMenu()">☰</div>
        <div class="header-title" id="pageTitle">Главная</div>
    </div>

    <div class="content">
        <div id="home" class="section active">
            <div class="days-counter">
                <div class="days-number" id="daysCount">—</div>
                <div class="days-label">дней вместе</div>
                <div class="together-since" id="sinceText">Укажи дату начала отношений</div>
            </div>
            <button onclick="setStartDate()">Указать дату начала отношений</button>
        </div>

        <div id="calendar" class="section">
            <h2>Общий календарь</h2>
            <input type="text" id="eventTitle" placeholder="Название события">
            <input type="date" id="eventDate">
            <textarea id="eventDesc" placeholder="Описание" rows="2"></textarea>
            <button onclick="addEvent()">Добавить событие</button>
            <div id="eventsList"><div class="empty">Загрузка...</div></div>
        </div>

        <div id="memories" class="section">
            <h2>Воспоминания</h2>
            <input type="text" id="memTitle" placeholder="Название">
            <input type="date" id="memDate">
            <input type="text" id="memPlace" placeholder="Место">
            <button onclick="addMemory()">Сохранить воспоминание</button>
            <div id="memoriesList"><div class="empty">Пока нет воспоминаний</div></div>
        </div>

        <div id="link" class="section">
            <h2>Привязать партнёра</h2>
            <div class="link-box">
                <div>Твой код:</div>
                <div class="code" id="myCode">------</div>
                <div style="font-size:14px;opacity:0.7;">Отправь этот код партнёру</div>
            </div>
            <input type="text" id="partnerCode" placeholder="Введи код партнёра">
            <button onclick="linkPartner()">Привязать</button>
            <div id="linkStatus" style="text-align:center;margin-top:16px;"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user || {};
        const userId = user.id || 123456789;

        // Показываем аккаунт в меню
        document.getElementById('userName').textContent = user.first_name || 'Пользователь';
        document.getElementById('userUsername').textContent = user.username ? '@' + user.username : '';
        if (user.photo_url) {
            document.getElementById('userAvatar').innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        }

        // Генерируем код из последних 6 цифр id
        const myCode = String(userId).slice(-6).padStart(6, '0');
        document.getElementById('myCode').textContent = myCode;

        function openMenu() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('show');
        }
        function closeMenu() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        function openSection(name) {
            closeMenu();
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            const titles = { home: 'Главная', calendar: 'Календарь', memories: 'Воспоминания', link: 'Привязка' };
            document.getElementById('pageTitle').textContent = titles[name] || name;
            if (name === 'calendar') loadEvents();
            if (name === 'memories') loadMemories();
            if (name === 'home') updateDays();
        }

        function updateDays() {
            const start = localStorage.getItem('relationshipStart');
            if (!start) {
                document.getElementById('daysCount').textContent = '—';
                document.getElementById('sinceText').textContent = 'Укажи дату начала отношений';
                return;
            }
            const diff = Math.floor((new Date() - new Date(start)) / 86400000);
            document.getElementById('daysCount').textContent = diff;
            document.getElementById('sinceText').textContent = 'Вместе с ' + new Date(start).toLocaleDateString('ru-RU');
        }

        function setStartDate() {
            const date = prompt('Дата начала (ГГГГ-ММ-ДД):', '2024-01-01');
            if (date) {
                localStorage.setItem('relationshipStart', date);
                updateDays();
            }
        }

        async function linkPartner() {
            const code = document.getElementById('partnerCode').value.trim();
            if (!code || code.length < 4) return tg.showAlert('Введи код партнёра');
            document.getElementById('linkStatus').textContent = 'Привязка пока в разработке...';
            // Здесь позже будет запрос к API
        }

        async function addEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const description = document.getElementById('eventDesc').value.trim();
            if (!title || !date) return tg.showAlert('Заполни название и дату');
            await fetch('/api/event', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, title, date, description})
            });
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventDesc').value = '';
            loadEvents();
        }

        async function loadEvents() {
            const res = await fetch(`/api/events?user_id=${userId}`);
            const events = await res.json();
            const c = document.getElementById('eventsList');
            c.innerHTML = events.length ? events.map(e => `
                <div class="card"><strong>${e.title}</strong><br>${e.date}<br><small>${e.description||''}</small></div>
            `).join('') : '<div class="empty">Пока нет событий</div>';
        }

        async function addMemory() {
            const title = document.getElementById('memTitle').value.trim();
            const date = document.getElementById('memDate').value;
            const place = document.getElementById('memPlace').value.trim();
            if (!title || !date) return tg.showAlert('Заполни название и дату');
            await fetch('/api/memory', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, title, date, place, photos:[]})
            });
            document.getElementById('memTitle').value = '';
            document.getElementById('memDate').value = '';
            document.getElementById('memPlace').value = '';
            loadMemories();
        }

        async function loadMemories() {
            const res = await fetch(`/api/memories?user_id=${userId}`);
            const mems = await res.json();
            const c = document.getElementById('memoriesList');
            c.innerHTML = mems.length ? mems.map(m => `
                <div class="card"><strong>${m.title}</strong><br>${m.date} • ${m.place||''}</div>
            `).join('') : '<div class="empty">Пока нет воспоминаний</div>';
        }

        updateDays();
    </script>
</body>
</html>
